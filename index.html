<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>交通</title>
  <!-- 引入 Bootstrap 5 美化介面 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hero-banner { background: linear-gradient(135deg, #1f3c88 0%, #070d59 100%); color: white; padding: 36px 0; }
    .image-stage { position: relative; display: inline-block; width: 100%; max-width: 820px; overflow: hidden; border-radius: 8px; background: #000; }
    .image-stage img { width: 100%; display: block; height: auto; }
    
    /* YOLO 標註框樣式 */
    .bbox {
      position: absolute;
      border: 2px solid;
      border-radius: 2px;
      pointer-events: none;
      box-sizing: border-box;
      transition: all 0.2s ease-in-out;
    }
    .bbox-label {
      position: absolute;
      top: -24px;
      left: -2px;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    
    /* 依類別設定顏色 */
    .box-blindspot { border-color: #e63946; background-color: rgba(230, 57, 70, 0.15); }
    .box-blindspot .bbox-label { background-color: #e63946; }
    
    .box-pedestrian { border-color: #ffb703; background-color: rgba(255, 183, 3, 0.18); }
    .box-pedestrian .bbox-label { background-color: #fb8500; color: #fff; }
    
    .box-intersection { border-color: #00b4d8; background-color: rgba(0, 180, 216, 0.15); }
    .box-intersection .bbox-label { background-color: #0077b6; }
  </style>
</head>
<body>

  <!-- 頂部橫幅 -->
  <header class="hero-banner text-center mb-4 shadow">
    <div class="container">
      <h2 class="fw-bold mb-1">AI 智慧交通安全辨識系統 (AITS)</h2>
      <p class="mb-0 text-white-50">無號誌路口偵測・轉角安全視距分析・行人風險評估</p>
    </div>
  </header>

  <div class="container mb-5">
    <div class="row g-4">
      
      <!-- 左側：影像推論展示區 -->
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <span class="fw-bold text-dark" id="caseTitle">場景偵測結果展示</span>
            <span class="badge bg-light text-secondary border">YOLOv8 Inference</span>
          </div>
          <div class="card-body text-center p-3">
            <div class="image-stage mx-auto shadow-sm" id="displayStage">
              <img id="mainImage" src="" alt="檢測影像">
              <!-- 標註框會由 JavaScript 動態插入 -->
            </div>
          </div>
          <div class="card-footer bg-white border-top-0 pt-0 pb-3">
            <div class="small fw-bold text-muted mb-2">切換展示案例：</div>
            <div class="btn-group w-100" role="group">
              <button type="button" class="btn btn-outline-primary active" id="btn0" onclick="switchCase(0)">
                案例 1: 住宅巷口視距受阻 (三福街)
              </button>
              <button type="button" class="btn btn-outline-primary" id="btn1" onclick="switchCase(1)">
                案例 2: 校門坡道無號誌交會 (龍華街)
              </button>
              <button type="button" class="btn btn-outline-primary" id="btn2" onclick="switchCase(2)">
                案例 3: 一般道路基準對照
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側：危險分數與指標面板 -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 mb-3">
          <div class="card-header bg-white py-3 fw-bold text-dark">
            即時交通危險等級評估
          </div>
          <div class="card-body">
            <div class="text-center py-2">
              <div class="text-secondary small fw-semibold">綜合風險指數</div>
              <h1 class="display-3 fw-bold my-1" id="riskScore">0</h1>
              <div id="riskBadge" class="badge fs-6 px-3 py-2 mt-1">計算中...</div>
            </div>

            <hr class="my-3">

            <h6 class="fw-bold small text-muted text-uppercase mb-2">特徵辨識清單</h6>
            <ul class="list-group list-group-flush mb-3" id="featureList">
              <!-- 特徵項目由 JS 動態更新 -->
            </ul>

            <div class="p-3 bg-light rounded small text-secondary">
              <div class="fw-bold text-dark mb-1">危險加權規則說明：</div>
              • 無號誌路口（Unsignalized）：+30 分<br>
              • 安全視距盲區（Blindspot）：+25 分 / 處<br>
              • 車道行人穿越（Pedestrian）：+20 分 / 人
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 預設三個案例的推論數據
    const demoCases = [
      {
        title: "案例 1：新北樹林三福街85巷（無號誌交岔、盲區、行人）",
        image: "13 三福街85巷.png",
        boxes: [
          { label: "intersection (0.91)", type: "box-intersection", top: "52%", left: "32%", width: "38%", height: "36%" },
          { label: "blindspot (0.94)", type: "box-blindspot", top: "42%", left: "10%", width: "22%", height: "42%" },
          { label: "pedestrian (0.87)", type: "box-pedestrian", top: "44%", left: "54%", width: "9%", height: "22%" }
        ],
        hasIntersection: true,
        blindspots: 1,
        pedestrians: 1
      },
      {
        title: "案例 2：校門周邊坡道無號誌交會（黃網線、行人群聚）",
        image: "龍華街.png",
        boxes: [
          { label: "intersection (0.88)", type: "box-intersection", top: "58%", left: "20%", width: "60%", height: "32%" },
          { label: "pedestrian (0.83)", type: "box-pedestrian", top: "54%", left: "38%", width: "8%", height: "18%" },
          { label: "pedestrian (0.79)", type: "box-pedestrian", top: "53%", left: "48%", width: "8%", height: "18%" }
        ],
        hasIntersection: true,
        blindspots: 0,
        pedestrians: 2
      },
      {
        title: "案例 3：標準市區道路（無風險特徵基準）",
        image: "對照組-安全.png",
        boxes: [],
        hasIntersection: false,
        blindspots: 0,
        pedestrians: 0
      }
    ];

    function switchCase(index) {
      const data = demoCases[index];
      const img = document.getElementById("mainImage");
      const stage = document.getElementById("displayStage");

      // 切換按鈕狀態
      [0, 1, 2].forEach(i => {
        const btn = document.getElementById("btn" + i);
        if (i === index) btn.classList.add("active");
        else btn.classList.remove("active");
      });

      document.getElementById("caseTitle").innerText = data.title;
      img.src = data.image;

      // 清除舊框
      const oldBoxes = stage.querySelectorAll(".bbox");
      oldBoxes.forEach(b => b.remove());

      // 產生新框
      data.boxes.forEach(b => {
        const box = document.createElement("div");
        box.className = `bbox ${b.type}`;
        box.style.top = b.top;
        box.style.left = b.left;
        box.style.width = b.width;
        box.style.height = b.height;

        const label = document.createElement("span");
        label.className = "bbox-label";
        label.innerText = b.label;
        box.appendChild(label);

        stage.appendChild(box);
      });

      // 計算危險指數
      let score = 15; // 基礎環境係數
      if (data.hasIntersection) score += 30;
      score += data.blindspots * 25;
      score += data.pedestrians * 20;

      const scoreEl = document.getElementById("riskScore");
      const badgeEl = document.getElementById("riskBadge");
      scoreEl.innerText = score;

      // 更新危險標籤
      if (score >= 70) {
        badgeEl.className = "badge bg-danger fs-6 px-3 py-2 mt-1 shadow-sm";
        badgeEl.innerText = "🚨 高風險路段 (High Risk)";
      } else if (score >= 40) {
        badgeEl.className = "badge bg-warning text-dark fs-6 px-3 py-2 mt-1 shadow-sm";
        badgeEl.innerText = "⚠️ 中度風險 (Moderate Risk)";
      } else {
        badgeEl.className = "badge bg-success fs-6 px-3 py-2 mt-1 shadow-sm";
        badgeEl.innerText = "✅ 低風險環境 (Safe)";
      }

      // 更新特徵項目
      const listEl = document.getElementById("featureList");
      listEl.innerHTML = "";

      const featureItems = [
        { name: "無號誌交岔路口", detected: data.hasIntersection },
        { name: `視距不良盲區 (${data.blindspots} 處)`, detected: data.blindspots > 0 },
        { name: `車道行人穿越 (${data.pedestrians} 人)`, detected: data.pedestrians > 0 }
      ];

      featureItems.forEach(item => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center px-0 py-2";
        li.innerHTML = `
          <span class="small">${item.name}</span>
          <span class="badge ${item.detected ? 'bg-danger' : 'bg-secondary'} rounded-pill">
            ${item.detected ? '已檢出' : '未檢出'}
          </span>
        `;
        listEl.appendChild(li);
      });
    }

    // 預設載入案例 1
    switchCase(0);
  </script>
</body>
</html>
